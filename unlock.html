<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SelfBike · Freischaltung (Gen2–Gen4)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--acc:#33a78c;--warn:#d29922;--err:#f85149;--line:#21262d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding:16px;max-width:820px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 12px}
button{background:var(--acc);color:#04150f;border:0;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer}
button:disabled{background:#30363d;color:var(--mut);cursor:default}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:4px 6px;border-bottom:1px solid var(--line)}
td:first-child{color:var(--mut);width:44%}
.ok{color:var(--acc)} .no{color:var(--err)} .lock{color:var(--warn)}
#log{background:#010409;border:1px solid var(--line);border-radius:6px;padding:8px;height:240px;overflow:auto;
     font:11px/1.45 ui-monospace,monospace;white-space:pre-wrap;color:#9da7b3}
.hint{color:var(--mut);font-size:12px}
</style>
</head>
<body>

<h1>Freischaltung · Diagnose-Ebene IBD</h1>
<p class="sub">Nur Gen2–Gen4. BES3 (Smart System) braucht das nicht. Ändert nichts dauerhaft – nach einem Neustart ist alles wieder zu.</p>

<div class="card">
  <button id="connect">Verbinden</button>
  <button id="all" class="sec" disabled>Alle drei freischalten</button>
  <p class="hint" id="dev">Kein Gerät verbunden.</p>
</div>

<div class="card">
  <table id="rows"></table>
</div>

<div class="card">
  <button id="readAll" class="sec" disabled>Geschützte Werte lesen</button>
  <button id="dtc" class="sec" disabled>Fehlerspeicher lesen</button>
  <button id="clear" class="sec" disabled>Fehlerspeicher löschen</button>
  <p class="hint">Löschen erst nach dem Lesen – der Stand wird vorher ins Protokoll geschrieben.</p>
</div>

<div id="log"></div>

<script type="module">
const VID = 0x108c, PID = 0x193;
const ECU = {
  DU:  { tx: 0x20, rx: 0x21, name: 'Motor',  key: '915EA072B411C427C6D4C649A8013E0C' },
  BMS: { tx: 0x22, rx: 0x23, name: 'Akku',   key: '36DE8519CA1A0EB8AE6E951BAA998847' },
  BUI: { tx: 0x3a, rx: 0x3d, name: 'Display', key: 'F90451B3BF2E20A7F737659A3A1EB4CC' },
};
const DIDS = {
  DU:  [[0x01,0x67,'Kilometerstand']],
  BMS: [[0x05,0x10,'Ladezustand %'],[0x04,0x13,'Spannung mV'],[0x04,0x33,'Temperatur'],[0x03,0x12,'Zyklen am Rad'],[0x03,0x13,'Zyklen extern'],[0x03,0x19,'Entnommene Ladung'],[0x02,0xa0,'Nennkapazität Wh']],
};

const hex = b => [...b].map(x => x.toString(16).padStart(2,'0')).join(' ');
const log = (m, c) => { const d=document.getElementById('log'); const s=document.createElement('div');
  if(c) s.className=c; s.textContent = new Date().toLocaleTimeString()+'  '+m; d.appendChild(s); d.scrollTop=d.scrollHeight; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

let dev = null;
const pending = new Map();   // rxAddr -> {resolve, reject, buf, want, timer}
const asm = new Map();       // rxAddr -> {buf, want}

async function send(dst, payload) {
  const f = new Uint8Array(64);
  f[0]=1; f[1]=0; f[2]=dst; f[3]=8;
  if (payload.length <= 13) { f[4]=payload.length; f.set(payload,5); }
  else {
    f[4]=0x10 | (payload.length >> 8); f[5]=payload.length & 0xff;
    f.set(payload.subarray(0,7), 6);
    await write(f);
    const fc = await waitFc(dst);
    let off = 7, seq = 1;
    while (off < payload.length) {
      const g = new Uint8Array(64);
      g[0]=1; g[1]=0; g[2]=dst; g[3]=8; g[4]=0x20 | (seq++ & 0x0f);
      const chunk = payload.subarray(off, off+7);
      g.set(chunk, 5); off += chunk.length;
      await write(g); await sleep(6);
    }
    return;
  }
  await write(f);
}
const write = async f => { log('TX '+hex(f.subarray(2, 5+f[4])), 'ok'); await dev.sendReport(0, f); };

let fcWait = null;
const waitFc = dst => new Promise((res, rej) => {
  fcWait = { res, rej, timer: setTimeout(() => rej(new Error('kein Flow Control')), 1000) };
});

async function request(dst, rx, payload, ms = 1500) {
  return new Promise(async (resolve, reject) => {
    pending.set(rx, { resolve, reject, timer: setTimeout(() => { pending.delete(rx); reject(new Error('Timeout')); }, ms) });
    try { await send(dst, payload); } catch (e) { pending.delete(rx); reject(e); }
  });
}

dev_oninput:
function onReport(e) {
  const d = new Uint8Array(e.data.buffer);
  const src = d[2], type = d[4] >> 4, len = d[4];
  if (src < 2) return;

  if (type === 3) {                       // Flow Control
    if (fcWait) { clearTimeout(fcWait.timer); const w = fcWait; fcWait = null; w.res(); }
    return;
  }
  if (type === 1) {                       // First Frame
    const want = ((d[4] & 0x0f) << 8) | d[5];
    asm.set(src, { buf: Array.from(d.subarray(6, 6 + (d[3] - 2))), want });
    const fc = new Uint8Array(64); fc[0]=1; fc[2]=src - (src===0x3d?3:1); fc[3]=8; fc[4]=0x30; fc[5]=0x10; fc[6]=0x05;
    dev.sendReport(0, fc);
    return;
  }
  if (type === 2) {                       // Consecutive Frame
    const a = asm.get(src);
    if (!a) { log('CF ohne offene Reassembly – verworfen', 'lock'); return; }
    const take = Math.min(d[3] - 1, a.want - a.buf.length);
    for (let i = 0; i < take; i++) a.buf.push(d[5 + i]);
    if (take < d[3] - 1) log(`CF ${take}/${d[3]-1} Byte genutzt, Rest verworfen`, 'lock');
    if (a.buf.length >= a.want) { asm.delete(src); finish(src, Uint8Array.from(a.buf)); }
    return;
  }
  finish(src, d.subarray(5, 5 + len));
}

function finish(src, payload) {
  log('RX '+hex(payload));
  const p = pending.get(src);
  if (p) { clearTimeout(p.timer); pending.delete(src); p.resolve(payload); }
  else log('unerwartete Antwort – verworfen', 'lock');
}

async function seedToKey(seed, keyHex) {
  const kb = Uint8Array.from(keyHex.match(/../g).map(h => parseInt(h, 16)));
  const k = await crypto.subtle.importKey('raw', kb, 'AES-CBC', false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-CBC', iv:new Uint8Array(16) }, k, seed));
}

const unlocked = new Set();

async function unlock(name) {
  const e = ECU[name];
  log(`— ${e.name}: Sitzung`, 'lock');
  let r = await request(e.tx, e.rx, Uint8Array.of(0x10, 0x03));
  if (r[0] !== 0x50) throw new Error(`${e.name}: Sitzung abgelehnt (${hex(r)})`);

  r = await request(e.tx, e.rx, Uint8Array.of(0x27, 0x11));
  if (r[0] === 0x7f) throw new Error(`${e.name}: Seed verweigert NRC ${r[2].toString(16)}`);
  if (r[0] !== 0x67) throw new Error(`${e.name}: unerwartet ${hex(r)}`);

  const seed = r.subarray(2, 18);
  if (seed.length !== 16) throw new Error(`${e.name}: Seed ${seed.length} Byte`);
  if (seed.every(b => b === 0)) { log(`${e.name}: schon frei`, 'ok'); unlocked.add(name); return; }

  const key = await seedToKey(seed, e.key);
  r = await request(e.tx, e.rx, Uint8Array.from([0x27, 0x12, ...key]));
  if (r[0] !== 0x67) throw new Error(`${e.name}: Key abgelehnt (${hex(r)})`);
  unlocked.add(name);
  log(`${e.name}: freigeschaltet`, 'ok');
}

// ---------- UI ----------
const rows = document.getElementById('rows');
for (const [k, e] of Object.entries(ECU)) {
  const tr = rows.insertRow();
  tr.insertCell().textContent = e.name;
  const c = tr.insertCell();
  const b = document.createElement('button');
  b.textContent = 'freischalten'; b.disabled = true;
  b.onclick = async () => { try { await unlock(k); b.textContent='frei'; b.className=''; mark(k,true); } catch (err) { log(err.message,'no'); } };
  c.appendChild(b);
  e.btn = b;
}

const cell = {};
function mark(name, ok) {
  if (!cell[name]) { const tr = rows.insertRow(); tr.insertCell().textContent = ECU[name].name; cell[name] = tr.insertCell(); }
  cell[name].textContent = ok ? '—' : 'gesperrt';
  cell[name].className = ok ? 'ok' : 'lock';
}

document.getElementById('connect').onclick = async () => {
  try {
    const [d] = await navigator.hid.requestDevice({ filters: [{ vendorId: VID, productId: PID }] });
    if (!d) return;
    await d.open();
    d.addEventListener('inputreport', onReport);
    dev = d;
    document.getElementById('dev').textContent = `Verbunden: ${d.productName || 'Display'}`;
    for (const e of Object.values(ECU)) e.btn.disabled = false;
    for (const id of ['all','readAll','dtc','clear']) document.getElementById(id).disabled = false;
    setInterval(() => { for (const e of Object.values(ECU)) if (unlocked.has(e.name) || true) send(e.tx, Uint8Array.of(0x3e, 0)).catch(()=>{}); }, 2000);
  } catch (err) { log('Verbinden: '+err.message, 'no'); }
};

document.getElementById('all').onclick = async () => {
  for (const k of Object.keys(ECU)) {
    try { await unlock(k); ECU[k].btn.textContent='frei'; mark(k,true); } catch (err) { log(err.message,'no'); }
    await sleep(200);
  }
};

document.getElementById('readAll').onclick = async () => {
  for (const [name, list] of Object.entries(DIDS)) {
    if (!unlocked.has(name)) { log(`${ECU[name].name}: nicht frei`, 'lock'); continue; }
    for (const [hi, lo, label] of list) {
      try {
        const r = await request(ECU[name].tx, ECU[name].rx, Uint8Array.of(0x22, hi, lo));
        if (r[0] === 0x62) mark2(name, label, hex(r.subarray(3)));
        else mark2(name, label, 'NRC ' + r[2].toString(16));
      } catch (err) { mark2(name, label, err.message); }
      await sleep(80);
    }
  }
};
function mark2(name, label, val) {
  const key = name + label;
  if (!cell[key]) { const tr = rows.insertRow(); tr.insertCell().textContent = `${ECU[name].name} · ${label}`; cell[key] = tr.insertCell(); }
  cell[key].textContent = val;
}

document.getElementById('dtc').onclick = async () => {
  for (const name of Object.keys(ECU)) {
    try {
      const r = await request(ECU[name].tx, ECU[name].rx, Uint8Array.of(0x19, 0x02, 0x08));
      if (r[0] !== 0x59) { log(`${ECU[name].name}: DTC NRC ${r[2]?.toString(16)}`, 'lock'); continue; }
      const out = [];
      for (let i = 3; i + 3 < r.length; i += 4)
        out.push(hex(r.subarray(i, i+3)).replace(/ /g,'') + ' · 0x' + r[i+3].toString(16).padStart(2,'0'));
      log(`${ECU[name].name}: ${out.length ? out.join(', ') : 'keine Fehler'}`, out.length ? 'lock' : 'ok');
    } catch (err) { log(`${ECU[name].name}: ${err.message}`, 'no'); }
    await sleep(120);
  }
};

document.getElementById('clear').onclick = async () => {
  if (!confirm('Fehlerspeicher aller drei Steuergeräte löschen?')) return;
  for (const name of Object.keys(ECU)) {
    try {
      const r = await request(ECU[name].tx, ECU[name].rx, Uint8Array.of(0x14, 0xff, 0xff, 0xff));
      log(`${ECU[name].name}: löschen ${r[0] === 0x54 ? 'ok' : 'NRC ' + r[2]?.toString(16)}`, r[0] === 0x54 ? 'ok' : 'no');
    } catch (err) { log(`${ECU[name].name}: ${err.message}`, 'no'); }
    await sleep(200);
  }
};
</script>
</body>
</html>
