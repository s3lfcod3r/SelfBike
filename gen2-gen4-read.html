<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SelfBike · Gen2–Gen4 lesen (Test)</title>
<link rel="icon" type="image/png" sizes="64x64" href="brand/favicon-64.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673;
    --line: #dde1e6; --accent: #1f5fd1; --ok: #1a7f37; --warn: #9a6700; --err: #c62828; --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1;
      --line: #2c323a; --accent: #6ea2ff; --ok: #56d364; --warn: #e3b341; --err: #ff7b72; --code: #0d1014;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.0rem; margin: 18px 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { border-left: 3px solid var(--warn); padding: 6px 12px; margin: 10px 0 0; font-size: .92rem; color: var(--muted); }
  .status { font-size: .92rem; color: var(--muted); margin: 10px 0 0; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: baseline; }
  td.val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  td.val small { font-weight: 400; color: var(--muted); }
  .ecu { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .bad td { color: var(--muted); }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 12px/1.45 ui-monospace, Consolas, monospace; margin: 10px 0 0; max-height: 220px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
    </div>
    <button id="lang" aria-label="Sprache / Language">EN</button>
  </header>

  <section>
    <p class="note" data-t="exp"></p>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="connect" data-t="b_connect"></button>
      <span class="status" id="status"></span>
    </div>
    <p class="status" id="env"></p>
    <p class="note" data-t="tabHint"></p>
  </section>

  <section id="resultBox" hidden>
    <div id="results"></div>
    <div class="row" style="margin-top:14px">
      <button id="save" data-t="b_save"></button>
      <button id="mail" data-t="b_mail"></button>
    </div>
  </section>

  <section id="logBox" hidden>
    <details>
      <summary data-t="protocol"></summary>
      <pre id="log"></pre>
    </details>
  </section>
</main>

<script type="module">
import { ECU, ITEMS, DTC_ECUS, buildHello, parseHello, buildSessionFrame, buildTesterPresent,
  buildReadFrame, buildDtcRead, buildFlowControl, frameType, parseUds } from './lib/gen24.js';

const BOSCH_VID = 0x108c;
const MAIL = 'info@selfcoder.de';

const T = {
  de: {
    title: 'SelfBike · Gen2–Gen4 lesen', lang: 'EN',
    lead: 'Testlauf: ältere Bosch-Antriebe (Gen2–Gen4) über das Display auslesen.',
    exp: 'Nur Lesen. Es werden ausschließlich Diagnose-Leseanfragen gesendet – nichts am Rad verändert. Chrome oder Edge am PC/Laptop, Display per USB verbinden.',
    b_connect: 'Verbinden und auslesen', b_save: 'Als Datei speichern', b_mail: 'E-Mail an Entwickler',
    protocol: 'Protokoll (für Entwickler)',
    env_bad: 'Dieser Browser kann kein WebHID. Bitte Chrome oder Edge am PC verwenden.',
    connecting: 'Verbinde…', handshaking: 'Handschlag…', reading: 'Lese Werte…',
    readingDtc: 'Lese Fehlerspeicher…', faults: 'Fehlerspeicher', noFaults: 'keine Fehler',
    hs_ok: 'Verbunden (Transport: {t}).', hs_fail: 'Handschlag fehlgeschlagen: {r}',
    no_device: 'Kein Gerät ausgewählt.', done: 'Fertig: {ok} gelesen · {locked} gesperrt · {na} nicht gelesen.',
    tabHint: 'Tipp: Nach dem Auslesen den Tab schließen, bevor du losfährst – sonst hält der Keep-alive die Diagnosesitzung offen.',
    err: 'Fehler: {e}', na: 'nicht gelesen', locked: 'gesperrt – Freischaltung nicht implementiert', saved: 'Datei gespeichert.',
    g_DU: 'Motor', g_BMS: 'Akku', g_BUI: 'Display',
    mail_subject: 'SelfBike Gen2-Gen4 Auslese-Test',
    mail_body: 'Hallo Sven,\n\nanbei mein Auslese-Ergebnis (bitte die gespeicherte Datei anhängen).\n',
  },
  en: {
    title: 'SelfBike · read Gen2–Gen4', lang: 'DE',
    lead: 'Test run: read older Bosch drive systems (Gen2–Gen4) through the display.',
    exp: 'Read-only. Only diagnostic read requests are sent – nothing on the bike is changed. Use Chrome or Edge on a PC/laptop, connect the display via USB.',
    b_connect: 'Connect and read', b_save: 'Save as file', b_mail: 'E-mail the developer',
    protocol: 'Protocol (for developers)',
    env_bad: 'This browser has no WebHID. Please use Chrome or Edge on a PC.',
    connecting: 'Connecting…', handshaking: 'Handshake…', reading: 'Reading values…',
    readingDtc: 'Reading fault memory…', faults: 'Fault memory', noFaults: 'no faults',
    hs_ok: 'Connected (transport: {t}).', hs_fail: 'Handshake failed: {r}',
    no_device: 'No device selected.', done: 'Done: {ok} read · {locked} locked · {na} not read.',
    tabHint: 'Tip: close the tab after reading, before you ride – otherwise the keep-alive holds the diagnostic session open.',
    err: 'Error: {e}', na: 'not read', locked: 'locked – unlock not implemented', saved: 'File saved.',
    g_DU: 'Motor', g_BMS: 'Battery', g_BUI: 'Display',
    mail_subject: 'SelfBike Gen2-Gen4 read test',
    mail_body: 'Hi Sven,\n\nattached is my read result (please attach the saved file).\n',
  },
};
let lang = (navigator.language || 'de').toLowerCase().startsWith('de') ? 'de' : 'en';
const t = (k, v = {}) => (T[lang][k] ?? T.de[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v[n] ?? '');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const report = { tool: 'selfbike-gen2-gen4-read', createdAt: new Date().toISOString(), transport: null, values: {}, trace: [] };
const hx = (a) => Array.from(a).map((b) => b.toString(16).padStart(2, '0')).join(' ');
// Genug Bytes loggen (Header + Länge + Nutzlast), nicht auf 16 Byte kappen.
function trace(dir, bytes) { report.trace.push(`${dir} ${hx(bytes).slice(0, 29 * 3)}`); $('log').textContent = report.trace.join('\n'); }

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  $('lang').textContent = t('lang');
}
$('lang').onclick = () => { lang = lang === 'de' ? 'en' : 'de'; applyLang(); if (rendered) render(); };

function checkEnv() {
  const ok = 'hid' in navigator && window.isSecureContext;
  $('env').textContent = ok ? '' : t('env_bad');
  $('connect').disabled = !ok;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const toArr = (dv) => { const a = new Uint8Array(dv.byteLength); for (let i = 0; i < a.length; i++) a[i] = dv.getUint8(i); return a; };
function logln(s) { report.trace.push(s); $('log').textContent = report.trace.join('\n'); $('logBox').hidden = false; }

// HID-Struktur des echten Geräts protokollieren (hilft bei der Fehlersuche).
function dumpDevice(device) {
  const rep = (l) => (l || []).map((r) => '#' + r.reportId).join(',') || '-';
  logln(`DEV "${device.productName || '?'}" VID=0x${(device.vendorId || 0).toString(16)} PID=0x${(device.productId || 0).toString(16)}`);
  for (const c of device.collections || []) {
    logln(`  coll up=0x${(c.usagePage || 0).toString(16)} usage=0x${(c.usage || 0).toString(16)} in=${rep(c.inputReports)} out=${rep(c.outputReports)} feat=${rep(c.featureReports)}`);
  }
}

// Eine Anfrage senden, auf passende Antwort warten; lauscht durchgehend (Geräte,
// die ständig senden) und wiederholt bei Bedarf. Jeder RX wird protokolliert.
async function exchange(device, out, { match, timeout = 500, tries = 1, label = '' } = {}) {
  for (let attempt = 0; attempt < tries; attempt++) {
    const res = await new Promise((resolve) => {
      let done = false;
      const onReport = (e) => {
        const arr = toArr(e.data);
        trace(`RX(${e.data.byteLength}B)`, arr);
        if (match(arr)) fin(arr);
      };
      const to = setTimeout(() => fin(null), timeout);
      function fin(v) { if (done) return; done = true; clearTimeout(to); device.removeEventListener('inputreport', onReport); resolve(v); }
      device.addEventListener('inputreport', onReport);
      trace('TX' + (label ? ' ' + label : '') + (tries > 1 ? ` #${attempt + 1}` : ''), out);
      device.sendReport(0, out).catch((err) => { logln('TX-FEHLER ' + err.name + ': ' + err.message); fin(null); });
    });
    if (res) return res;
    await sleep(120);
  }
  return null;
}

// Eine UDS-Anfrage senden und die Antwort zusammensetzen (SF direkt, FF+CF mit Flow Control).
async function readUds(device, ecu, reqFrame, label) {
  const rx = ECU[ecu].rx, tx = ECU[ecu].tx;
  const first = await exchange(device, reqFrame, {
    match: (a) => { const f = frameType(a); return !!f && f.canRx === rx && (f.kind === 'SF' || f.kind === 'FF'); },
    timeout: 600, tries: 2, label,
  });
  if (!first) return null;
  const f0 = frameType(first);
  if (f0.kind === 'SF') return { uds: f0.data, canRx: rx };
  const parts = Array.from(f0.data);                       // First Frame: erste 6 Bytes
  const rest = await collectCF(device, tx, rx, f0.total - parts.length);
  for (const b of (rest || [])) parts.push(b);
  return { uds: Uint8Array.from(parts.slice(0, f0.total)), canRx: rx, partial: rest === null };
}

// Nach einem First Frame: Flow Control senden und Folgeframes (CF) sammeln.
function collectCF(device, tx, rx, need) {
  return new Promise((resolve) => {
    const out = []; let done = false;
    const onReport = (e) => {
      const a = toArr(e.data); const f = frameType(a);
      if (!f || f.canRx !== rx || f.kind !== 'CF') return;
      trace('RX(cf)', a);
      for (const b of f.data) if (out.length < need) out.push(b);
      if (out.length >= need) fin(out);
    };
    const to = setTimeout(() => fin(out.length ? out : null), 900);
    function fin(v) { if (done) return; done = true; clearTimeout(to); device.removeEventListener('inputreport', onReport); resolve(v); }
    device.addEventListener('inputreport', onReport);
    trace('TX fc', buildFlowControl(tx));
    device.sendReport(0, buildFlowControl(tx)).catch(() => fin(null));
  });
}

let rendered = false;
$('connect').onclick = async () => {
  $('connect').disabled = true;
  report.values = {}; report.trace = [];
  try {
    $('status').textContent = t('connecting');
    const list = await navigator.hid.requestDevice({ filters: [{ vendorId: BOSCH_VID }] });
    if (!list.length) { $('status').textContent = t('no_device'); $('connect').disabled = false; return; }
    const device = list[0];
    if (!device.opened) await device.open();

    dumpDevice(device);

    $('status').textContent = t('handshaking');
    // Handschlag mehrfach versuchen – wie die Bosch-Software (Wiederholung).
    const hbuf = await exchange(device, buildHello(1), { match: (a) => a[0] === 0 && a[1] === 1, timeout: 400, tries: 12, label: 'hello' });
    const hres = hbuf ? parseHello(hbuf) : { ok: false, reason: 'timeout' };
    if (!hres.ok) { $('status').textContent = t('hs_fail', { r: hres.reason }); report.transport = `fail:${hres.reason}`; showLog(); return; }
    report.transport = hres.transportName;
    $('status').textContent = t('hs_ok', { t: hres.transportName });

    // Sitzungen (nicht-schreibend) je Steuergerät starten – Fehler werden toleriert.
    const ecus = new Set([...DTC_ECUS, ...ITEMS.map((i) => i.ecu)]);
    for (const e of ecus) {
      await exchange(device, buildSessionFrame(ECU[e].tx), { match: (a) => a[2] === ECU[e].rx, timeout: 400, tries: 2, label: 'session ' + e });
    }
    let lastKa = Date.now();
    const keepAlive = async (ecu) => {
      if (Date.now() - lastKa < 3000) return;
      await exchange(device, buildTesterPresent(ECU[ecu].tx), { match: (a) => a[2] === ECU[ecu].rx, timeout: 200, tries: 1, label: 'keepalive ' + ecu });
      lastKa = Date.now();
    };

    // Fehlerspeicher (DTC) je Steuergerät – erwartet frei, ohne Freischaltung.
    $('status').textContent = t('readingDtc');
    report.dtc = {};
    for (const e of DTC_ECUS) {
      await keepAlive(e);
      const res = await readUds(device, e, buildDtcRead(ECU[e].tx), 'DTC ' + e);
      const u = res ? parseUds(res.uds, res.canRx) : null;
      if (u && u.ok && u.dtc) report.dtc[e] = { codes: u.codes };
      else if (u && u.negative && u.nrc === 0x33) report.dtc[e] = { locked: true };
      else if (u && u.negative) report.dtc[e] = { nrc: u.nrc };
      else report.dtc[e] = { na: true };
      render();
    }

    $('status').textContent = t('reading');
    for (const item of ITEMS) {
      await keepAlive(item.ecu);
      const res = await readUds(device, item.ecu, buildReadFrame(ECU[item.ecu].tx, item.did), item.key);
      const u = res ? parseUds(res.uds, res.canRx) : null;
      if (u && u.ok && u.did === item.did) report.values[item.key] = item.dec(u.data);
      else if (u && u.negative && u.nrc === 0x33) report.values[item.key] = '__locked__';
      else report.values[item.key] = null;
      render();
    }
    // Zustände getrennt zählen: gelesen / gesperrt / nicht gelesen.
    let ok = 0, locked = 0, na = 0;
    for (const v of Object.values(report.values)) {
      if (v === '__locked__') locked++; else if (v === null || v === undefined) na++; else ok++;
    }
    for (const d of Object.values(report.dtc)) {
      if (d.locked) locked++; else if (d.na || d.nrc != null) na++; else ok++;
    }
    $('status').textContent = t('done', { ok, locked, na });
    showLog();
  } catch (err) {
    $('status').textContent = t('err', { e: err.message });
    showLog();
  } finally {
    $('connect').disabled = false;
  }
};

function showLog() { $('logBox').hidden = report.trace.length === 0; }

const EN_LABEL = {
  displayType: 'Display type', displaySw: 'Display software', batteryType: 'Battery type',
  batteryPart: 'Battery part number', batterySw: 'Battery software',
  odometer: 'Odometer', soc: 'State of charge', voltage: 'Voltage', packTemp: 'Temperature',
  cyclesOnBike: 'Charge cycles (on bike)', cyclesOffBike: 'Charge cycles (external charger)',
  providedAh: 'Total charge delivered', nominalWh: 'Nominal capacity',
};

function render() {
  rendered = true;
  $('resultBox').hidden = false;
  const groups = {};
  for (const item of ITEMS) (groups[item.ecu] ||= []).push(item);
  let html = '';
  if (report.dtc && Object.keys(report.dtc).length) {
    html += `<h2>${esc(t('faults'))}</h2><table><tbody>`;
    for (const e of DTC_ECUS) {
      const d = report.dtc[e]; if (!d) continue;
      let v, bad = false;
      if (d.locked) { v = `<small>${esc(t('locked'))}</small>`; bad = true; }
      else if (d.na) { v = `<small>${esc(t('na'))}</small>`; bad = true; }
      else if (d.nrc != null) { v = `<small>NRC 0x${d.nrc.toString(16)}</small>`; bad = true; }
      else if (!d.codes.length) v = esc(t('noFaults'));
      else v = esc(d.codes.map((c) => c.code).join(', '));
      html += `<tr class="${bad ? 'bad' : ''}"><td>${esc(t('g_' + e))}</td><td class="val">${v}</td></tr>`;
    }
    html += '</tbody></table>';
  }
  for (const [ecu, items] of Object.entries(groups)) {
    html += `<h2>${esc(t('g_' + ecu))}</h2><table><tbody>`;
    for (const item of items) {
      const v = report.values[item.key];
      const label = lang === 'en' ? (EN_LABEL[item.key] || item.label) : item.label;
      let cell, bad = false;
      if (v === '__locked__') { cell = `<td class="val"><small>${esc(t('locked'))}</small></td>`; bad = true; }
      else if (v === null || v === undefined) { cell = `<td class="val"><small>${esc(t('na'))}</small></td>`; bad = true; }
      else if (item.kind === 'text') cell = `<td class="val">${esc(v)}</td>`;
      else cell = `<td class="val">${esc(Number(v).toFixed(item.digits))} <small>${esc(item.unit)}</small></td>`;
      html += `<tr class="${bad ? 'bad' : ''}"><td>${esc(label)}</td>${cell}</tr>`;
    }
    html += '</tbody></table>';
  }
  $('results').innerHTML = html;
}

$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(report, null, 1)], { type: 'application/json' }));
  a.download = `selfbike-gen2-gen4-read-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  $('status').textContent = t('saved');
};
$('mail').onclick = () => {
  location.href = `mailto:${MAIL}?subject=${encodeURIComponent(t('mail_subject'))}&body=${encodeURIComponent(t('mail_body'))}`;
};

applyLang();
checkEnv();
</script>
</body>
</html>
