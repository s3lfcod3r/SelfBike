<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SelfBike</title>
<link rel="icon" type="image/png" sizes="64x64" href="brand/favicon-64.png">
<link rel="apple-touch-icon" href="brand/favicon-192.png">
<link rel="stylesheet" href="brand/tokens.css">
<style>
  /* SelfBike – einfache Ansicht im iPhone-Stil. Farben nur aus brand/tokens.css */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--self-bg-0); color: var(--self-text); }
  body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
         -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }

  header.big { padding: calc(14px + env(safe-area-inset-top)) 4px 10px; }
  .topline { display: flex; align-items: center; gap: 8px; min-height: 22px; font-size: 13px; color: var(--self-text-3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
  .conn.on { color: var(--self-green); } .conn.busy { color: var(--self-yellow); }
  .langsel { margin-left: auto; background: var(--self-bg-2); color: var(--self-text); border: 1px solid var(--self-line-strong);
             border-radius: 9px; padding: 5px 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .langsel option { color: #000; }
  .foothelp { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; margin: 34px 0 0; padding-top: 14px;
              border-top: 1px solid var(--self-line); font-size: 14px; }
  .foothelp a, .foothelp button { color: var(--self-teal-bright); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: none; }
  .badge { font-size: 11px; font-weight: 600; color: var(--self-yellow); border: 1px solid currentColor; border-radius: 6px; padding: 1px 6px; }
  h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 0; }
  .sub { color: var(--self-text-2); margin: 2px 0 0; font-size: 15px; }

  /* Kacheln */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .tile { background: var(--self-bg-2); border-radius: 16px; padding: 14px; border: 1px solid var(--self-line); }
  .tile.wide { grid-column: 1 / -1; }
  .tile .k { font-size: 13px; color: var(--self-text-2); }
  .tile .n { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
  .tile .n small { font-size: 16px; font-weight: 600; color: var(--self-text-2); margin-left: 3px; }
  .tile .c { font-size: 13px; color: var(--self-text-2); margin-top: 4px; }
  .meter { height: 8px; border-radius: 4px; background: var(--self-bg-3); margin-top: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; background: var(--self-green); }
  .good { color: var(--self-green); } .warn { color: var(--self-yellow); } .bad { color: var(--self-red); }

  /* Gruppierte Listen wie in den iPhone-Einstellungen */
  .gh { font-size: 13px; color: var(--self-text-2); margin: 22px 16px 6px; text-transform: none; }
  .group { background: var(--self-bg-2); border-radius: 14px; overflow: hidden; border: 1px solid var(--self-line); }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 14px; background: none;
         border: 0; text-align: left; cursor: pointer; position: relative; color: var(--self-text); text-decoration: none; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; border-top: 1px solid var(--self-line); }
  .row.noico + .row::before, .group.noico .row + .row::before { left: 14px; }
  .row:active { background: var(--self-bg-3); }
  .row .ico { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: none; background: var(--self-teal); color: #fff; }
  .row .ico svg { width: 17px; height: 17px; }
  .row .t { flex: 1; min-width: 0; }
  .row .t small { display: block; font-size: 13px; color: var(--self-text-2); }
  .row .v { color: var(--self-text-2); font-size: 15px; text-align: right; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .chev { color: var(--self-text-3); font-size: 22px; line-height: 1; margin-left: -4px; }
  .row.danger { color: var(--self-red); justify-content: center; }
  .row.static { cursor: default; } .row.static:active { background: none; }
  .row select { background: transparent; border: 0; color: var(--self-text-2); text-align: right; max-width: 60%; padding: 4px 0; }
  .row select option { color: #000; }
  .row .check { color: var(--self-teal-bright); font-size: 20px; visibility: hidden; }
  .row.sel .check { visibility: visible; }
  .foot { font-size: 13px; color: var(--self-text-2); margin: 6px 16px 0; }
  .explain { font-size: 16px; color: var(--self-text-2); margin: 4px 4px 0; }

  /* Schalter */
  input.sw { appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--self-bg-3); position: relative;
             flex: none; cursor: pointer; transition: background .2s; border: 1px solid var(--self-line-strong); }
  input.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; border-radius: 50%; background: #fff; transition: left .2s; }
  input.sw:checked { background: var(--self-green); border-color: transparent; }
  input.sw:checked::after { left: 22px; }
  input.sw:disabled { opacity: .4; cursor: default; }

  /* Zahlen und Schieberegler */
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--self-bg-3); font-size: 20px; cursor: pointer; }
  .stepper input, .numin { width: 74px; text-align: center; background: var(--self-bg-3); border: 0; border-radius: 10px; padding: 7px 4px; }
  input[type=date].numin { width: auto; padding: 7px 10px; }
  .slider { padding: 12px 14px; }
  .slider .top { display: flex; justify-content: space-between; align-items: baseline; }
  .slider .val { font-weight: 700; font-size: 20px; color: var(--self-teal-bright); }
  .slider input[type=range] { width: 100%; accent-color: var(--self-teal); margin: 10px 0 2px; }
  .slider .hint { font-size: 13px; color: var(--self-text-2); }
  .slider .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--self-text-3); }

  /* Knöpfe */
  .btn-big { display: block; width: 100%; margin-top: 22px; padding: 15px; border: 0; border-radius: 14px; background: var(--self-teal);
             color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
  .btn-big:disabled { opacity: .4; cursor: default; }
  .btn-big.plain { background: var(--self-bg-2); color: var(--self-teal-bright); border: 1px solid var(--self-line); }
  .btn-text { display: block; margin: 14px auto 0; background: none; border: 0; color: var(--self-teal-bright); cursor: pointer; font-size: 15px; }
  .btn-text.red { color: var(--self-red); }

  .card { background: var(--self-bg-2); border: 1px solid var(--self-line); border-radius: 18px; padding: 22px 18px; margin-top: 10px; text-align: center; }
  .card .logo { width: 64px; height: 64px; margin: 0 auto 8px; display: block; }
  .card h2 { margin: 6px 0; font-size: 22px; }
  .card p { color: var(--self-text-2); margin: 6px 0; }
  .alert { background: color-mix(in oklab, var(--self-yellow) 14%, transparent); color: var(--self-text); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }

  /* Tab-Leiste unten */
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 0;
               background: color-mix(in oklab, var(--self-bg-1) 88%, transparent); backdrop-filter: blur(18px);
               border-top: 1px solid var(--self-line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
  nav.tabbar button { flex: 1; max-width: 160px; background: none; border: 0; color: var(--self-text-3); font-size: 11px; cursor: pointer; padding: 4px 0; }
  nav.tabbar svg { display: block; margin: 0 auto 2px; width: 26px; height: 26px; }
  nav.tabbar button.on { color: var(--self-teal-bright); }

  /* Blätter (von unten) */
  .sheet { position: fixed; inset: 0; z-index: 10; display: none; background: rgba(0,0,0,.45); }
  .sheet.open { display: flex; align-items: flex-end; justify-content: center; }
  .panel { width: 100%; max-width: 560px; max-height: 94vh; background: var(--self-bg-0); border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
           animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .phead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--self-line); }
  .phead h2 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
  .phead button { background: none; border: 0; color: var(--self-teal-bright); cursor: pointer; font-size: 16px; justify-self: start; padding: 4px 0; }
  .phead button.r { justify-self: end; font-weight: 600; }
  .pbody { overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); }

  /* Vorher → nachher */
  .chg { display: grid; grid-template-columns: 1fr; gap: 2px; }
  .chg .b { color: var(--self-text-3); text-decoration: line-through; font-size: 14px; }
  .chg .a { color: var(--self-teal-bright); font-weight: 600; }

  /* Fortschrittskreis */
  .ring { position: relative; width: 132px; height: 132px; margin: 14px auto 10px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-weight: 700; }
  .status { text-align: center; font-size: 16px; margin: 6px 8px 0; }
  .status.ok { color: var(--self-green); } .status.err { color: var(--self-red); } .status.warn { color: var(--self-yellow); }
  pre.log { font: 12px/1.5 ui-monospace, monospace; color: var(--self-text-2); white-space: pre-wrap; max-height: 200px; overflow: auto; margin: 8px 0 0; }
  details summary { cursor: pointer; color: var(--self-text-2); font-size: 14px; margin-top: 16px; }

  /* Meldungen unten */
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 20;
           max-width: min(520px, calc(100% - 32px)); background: var(--self-bg-3); border: 1px solid var(--self-line-strong);
           border-radius: 14px; padding: 12px 16px; font-size: 15px; box-shadow: 0 12px 30px rgba(0,0,0,.35); display: none; }
  .toast.show { display: block; }
  .toast.ok { border-color: var(--self-green); } .toast.warn { border-color: var(--self-yellow); } .toast.err { border-color: var(--self-red); }

  .fault { padding: 12px 14px; } .fault + .fault { border-top: 1px solid var(--self-line); }
  .fault b { display: block; } .fault span { display: block; color: var(--self-text-2); font-size: 14px; white-space: pre-line; }
  .kvv { color: var(--self-text-2); text-align: right; font-size: 15px; }
  .disc-body h3 { font-size: 16px; margin: 16px 0 4px; } .disc-body p { color: var(--self-text-2); margin: 0; font-size: 15px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="big">
    <div class="topline"><span class="conn" id="conn"><span class="dot"></span> <span id="connText"></span></span>
      <span class="badge hidden" id="demoBadge" data-i18n="demo.badge"></span>
      <select id="topLang" class="langsel" aria-label="Sprache / Language" title="Sprache / Language"></select></div>
    <h1 id="pageTitle"></h1>
    <p class="sub" id="pageSub"></p>
  </header>

  <!-- Start / Übersicht -->
  <section id="tab-home">
    <div class="card" id="connectCard">
      <img class="logo" src="brand/favicon-192.png" alt="">
      <h2 data-i18n="ui.connect"></h2>
      <p data-i18n="ui.connectText"></p>
      <p class="alert hidden" id="insecure"></p>
      <button class="btn-big" id="connect" data-i18n="ui.connect"></button>
      <button class="btn-text" id="demoStart" data-i18n="ui.demo"></button>
    </div>
    <div id="home" class="hidden">
      <div class="alert hidden" id="pendingHint"></div>
      <div class="tiles" id="tiles"></div>
      <div id="ride"></div>
      <div id="moreList"></div>
    </div>
  </section>

  <section id="tab-settings" class="hidden">
    <p class="explain" data-i18n="ui.settingsExplain"></p>
    <div class="group" style="margin-top:14px" id="settingsList"></div>
  </section>

  <!-- Immer sichtbar: rechtliche Hinweise, Unterstützung, klassische Ansicht -->
  <footer class="foothelp">
    <button id="showLegal" data-i18n="tools.legal"></button>
    <a href="https://ko-fi.com/s3lfcod3r" target="_blank" rel="noopener">☕ <span data-i18n="support.kofi"></span></a>
  </footer>
</div>

<nav class="tabbar">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1.5-3H7M13 9l2 7"/></svg><span data-i18n="ui.home"></span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-i18n="ui.settings"></span></button>
</nav>

<!-- Blatt für Einstellungen und Details -->
<div class="sheet" id="sheet"><div class="panel">
  <div class="phead"><button id="sheetBack"></button><h2 id="sheetTitle"></h2><span></span></div>
  <div class="pbody" id="sheetBody"></div>
</div></div>

<!-- Bestätigen: vorher → nachher -->
<div class="sheet" id="confirmSheet"><div class="panel">
  <div class="phead"><button id="confirmCancel" data-i18n="preview.cancel"></button><h2 data-i18n="ui.confirmTitle"></h2><span></span></div>
  <div class="pbody">
    <p class="explain" id="confirmPlan" style="margin:0 4px 10px;font-weight:600;color:var(--self-text)"></p>
    <div class="group noico" id="confirmList"></div>
    <div id="confirmWarn"></div>
    <p class="foot" id="confirmText"></p>
    <button class="btn-big" id="confirmGo" data-i18n="ui.confirmGo"></button>
  </div>
</div></div>

<!-- Fortschritt mit Kreis -->
<div class="sheet" id="progSheet"><div class="panel">
  <div class="phead"><span></span><h2 id="progTitle"></h2><span></span></div>
  <div class="pbody">
    <div class="ring">
      <svg viewBox="0 0 132 132" width="132" height="132">
        <circle cx="66" cy="66" r="58" fill="none" stroke="var(--self-bg-3)" stroke-width="11"/>
        <circle id="ringArc" cx="66" cy="66" r="58" fill="none" stroke="var(--self-teal-bright)" stroke-width="11" stroke-linecap="round"
                stroke-dasharray="364.4" stroke-dashoffset="364.4" style="transition:stroke-dashoffset .4s ease, stroke .3s"/>
      </svg>
      <div class="pct" id="ringPct">0%</div>
    </div>
    <p class="status" id="progStatus"></p>
    <div class="card hidden" id="progKofi" style="padding:16px">
      <p data-i18n="support.thanks" style="margin:0 0 10px"></p>
      <a class="btn-big plain" style="margin:0" href="https://ko-fi.com/s3lfcod3r" target="_blank" rel="noopener">☕ <span data-i18n="support.kofi"></span></a>
    </div>
    <details><summary data-i18n="log.title"></summary><pre class="log" id="progLog"></pre></details>
    <button class="btn-big hidden" id="progDone" data-i18n="ui.done"></button>
  </div>
</div></div>

<!-- Rechtlicher Hinweis -->
<div class="sheet" id="discSheet"><div class="panel">
  <div class="phead"><span></span><h2 data-i18n="tools.legal"></h2><button class="r hidden" id="discClose" data-i18n="ui.done"></button></div>
  <div class="pbody">
    <div class="group noico"><label class="row"><span class="t" data-i18n="lang.label"></span><select id="discLang"></select></label></div>
    <h2 data-i18n="disc.title" style="font-size:20px;margin:18px 4px 4px"></h2>
    <p class="explain" data-i18n="disc.intro"></p>
    <div class="disc-body" style="margin:0 4px">
      <h3 data-i18n="disc.1t"></h3><p data-i18n="disc.1"></p><h3 data-i18n="disc.2t"></h3><p data-i18n="disc.2"></p>
      <h3 data-i18n="disc.3t"></h3><p data-i18n="disc.3"></p><h3 data-i18n="disc.4t"></h3><p data-i18n="disc.4"></p>
      <h3 data-i18n="disc.5t"></h3><p data-i18n="disc.5"></p><h3 data-i18n="disc.6t"></h3><p data-i18n="disc.6"></p>
      <h3 data-i18n="disc.7t"></h3><p data-i18n="disc.7"></p>
      <p style="margin-top:14px;font-size:13px" data-i18n="disc.binding"></p>
    </div>
    <div id="discAcceptBox">
      <div class="group noico" style="margin-top:16px"><label class="row"><span class="t" data-i18n="disc.check" style="font-size:15px"></span><input type="checkbox" class="sw" id="discCheck"></label></div>
      <button class="btn-big" id="discAccept" disabled data-i18n="disc.accept"></button>
    </div>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script type="module">
import { McspUsb } from './lib/mcsp-usb.js';
import { BikeReader, DISPLAY_LANGUAGES } from './lib/bike-reader.js';
import { READ_PLAN } from './lib/datapoints.js';
import { hex } from './lib/messagebus.js';
import {
  readAll, byKey, heartbeat, planLight, planService, planDisplay, planRestore, startModeOptions, applyPlan, guardedKeys, LIGHT_MODES,
} from './lib/bike-writer.js';
import { DemoUsb } from './lib/demo-usb.js';
import { savePending, loadPending, clearPending, checkPending } from './lib/care.js';
import { createBackup, backupFileName, pickBackupFile, writeBackupFile, parseBackup, recordOutcome } from './lib/backup.js';
import { readFaults } from './lib/diagnostics.js';
import { readAssistModes, planModeChange, planModeReset, canEdit, bounds, EDITABLE, modeSummary } from './lib/assist-modes.js';
import { loadCatalog, lookupIssue, importCatalog, catalogInfo } from './lib/issue-catalog.js';
import { buildReportHtml } from './lib/report.js';
import { addSnapshot, snapshotFromRows } from './lib/history.js';
import { LANGS, t, setLang, detectLang, applyStatic, fmtNum, fmtDate, fmtDateTime, lang } from './lib/i18n.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const km = (m, digits = 0) => `${fmtNum(m / 1000, digits)} km`;

let usb = null;
let reader = null;
let rows = [];
let S = {};
let faults = [];
let modes = [];
let busy = false;
let blocked = false;   // nach unklarem Schreibversuch
let demo = false;
let tab = 'home';
let pending = null;    // { plan, state }
let hbTimer = null;
let hbFailures = 0;
const logLines = [];

const ok = (key) => S[key]?.status === 'ok';
const val = (key) => (ok(key) ? S[key].value : null);
const txt = (key, fallback = '–') => (ok(key) && S[key].value !== '' && S[key].text ? S[key].text : fallback);
const dpLabel = (key) => (t(`dp.${key}`) !== `dp.${key}` ? t(`dp.${key}`) : READ_PLAN.find((p) => p.key === key)?.label ?? key);
const log = (m) => { logLines.push(`${new Date().toLocaleTimeString()}  ${m}`); };

// ---------- Meldungen ----------

let toastTimer = null;
function toast(text, kind = '') {
  clearTimeout(toastTimer);
  $('toast').textContent = text;
  $('toast').className = `toast show ${kind}`;
  // Erfolg/Info verschwindet von selbst, Warnungen bleiben länger
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), kind === 'err' ? 9000 : kind === 'warn' ? 6000 : 3500);
}
$('toast').onclick = () => $('toast').classList.remove('show');

// ---------- Kopf, Tabs ----------

const TITLES = { home: 'ui.home', settings: 'ui.settings' };
function showTab(name) {
  tab = name;
  for (const k of Object.keys(TITLES)) $(`tab-${k}`).classList.toggle('hidden', k !== name);
  for (const b of document.querySelectorAll('nav.tabbar button')) b.classList.toggle('on', b.dataset.tab === name);
  renderHead();
  scrollTo(0, 0);
}
for (const b of document.querySelectorAll('nav.tabbar button')) b.onclick = () => showTab(b.dataset.tab);

function renderHead() {
  $('pageTitle').textContent = tab === 'home' && rows.length
    ? ([txt('oemBrand', ''), txt('oemModel', '')].join(' ').trim() || t('ui.home')) : t(TITLES[tab]);
  $('pageSub').textContent = tab === 'home' && rows.length ? t('ui.homeSub') : '';
  $('conn').className = `conn ${busy ? 'busy' : usb ? 'on' : ''}`;
  $('connText').textContent = t(busy ? 'conn.busy' : usb ? 'conn.on' : 'conn.off');
  $('demoBadge').classList.toggle('hidden', !demo);
}

// ---------- Übersicht ----------

function health(soh) {
  if (soh == null) return ['', ''];
  if (soh >= 90) return [t('health.vgood'), 'good'];
  if (soh >= 80) return [t('health.good'), 'good'];
  if (soh >= 70) return [t('health.ok'), 'warn'];
  return [t('health.weak'), 'bad'];
}
function serviceText() {
  const s = val('serviceDue');
  const odo = val('odometer');
  if (!s) return { n: '–', c: t('tile.unreadable') };
  if (!s.timestamp && !s.odometer) return { n: t('tile.none'), c: t('tile.svcNone') };
  if (s.odometer) {
    const left = (s.odometer - (odo ?? 0)) / 1000;
    return { n: left > 0 ? fmtNum(left, 0) : t('tile.due'), unit: left > 0 ? 'km' : '', warn: left < 100,
      c: s.timestamp ? t('tile.svcDate', { date: fmtDate(s.timestamp) }) : '' };
  }
  const days = Math.ceil((s.timestamp * 1000 - Date.now()) / 86400000);
  return { n: days > 0 ? String(days) : t('tile.due'), unit: days > 0 ? t('tile.days') : '', warn: days < 30, c: t('tile.svcDate', { date: fmtDate(s.timestamp) }) };
}
// Fahrrad-Check: Region, Unterstützung bis, Tuning-Erkennung.
// Bosch meldet „Unterstützung bis“ etwas über der gesetzlichen Grenze (Abregelbereich, z. B. 27,4 bei 25);
// auffällig erst bei mehr als 10 % darüber, bei einer gesetzlichen Grenze über 25 km/h oder erkannter Manipulation.
function checkTile() {
  const tuning = val('tuning');
  if (!tuning && !ok('region')) return '';
  const suspicious = !!tuning && (tuning.flag || tuning.counter > 0);
  const speed = val('maxAssistSpeed');
  const legal = val('maxLegalSpeed') ?? 25;
  const warn = suspicious || (speed != null && speed > legal * 1.1 + 0.2) || legal > 25.5;
  return `<div class="tile wide"><div class="k">${esc(t('tile.check'))}</div>
    <div class="n ${warn ? 'warn' : 'good'}" style="font-size:24px">${esc(t(warn ? 'check.warn' : 'check.ok'))}</div>
    ${ok('region') ? `<div class="c">${esc(`${t('check.region')}: ${txt('region')}`)}</div>` : ''}
    ${speed != null ? `<div class="c">${esc(t('check.speed', { v: txt('maxAssistSpeed') }))}${ok('maxLegalSpeed') ? ` · ${esc(t('check.legal', { v: txt('maxLegalSpeed') }))}` : ''}</div>` : ''}
    ${tuning ? `<div class="c ${suspicious ? 'bad' : 'good'}">${esc(txt('tuning'))}</div>` : ''}</div>`;
}

// Strecke pro Fahrmodus (mit Reichweite) und Fahrstatistik
function renderRide() {
  const maxDist = Math.max(1, ...modes.map((m) => m.distance ?? 0));
  const sumDist = modes.reduce((n, m) => n + (m.distance ?? 0), 0);
  // Reichweite pro Modus: Restenergie ÷ (Energie ÷ Strecke)
  const remainingWh = val('batteryRiderWh') ?? val('batteryRemainingWh');
  const range = (m) => (remainingWh && m.distance > 0 && m.energy > 0 ? Math.round(remainingWh / (m.energy / (m.distance / 1000))) : null);
  const modeRows = modes.map((m) => `<div class="slider">
      <div class="top"><span style="font-weight:600">${esc(m.name)}</span>
        <span>${m.distance == null ? '–' : esc(km(m.distance, 1))}${sumDist && m.distance != null ? ` <span style="color:var(--self-text-3)">${esc(fmtNum((m.distance / sumDist) * 100))} %</span>` : ''}</span></div>
      <div class="meter"><i style="width:${((m.distance ?? 0) / maxDist) * 100}%;background:var(--self-teal-bright)"></i></div>
      <div class="hint" style="margin-top:6px">${esc(modeSummary(m.udam))}${range(m) ? ` · ${esc(t('ride.rangeKm', { km: range(m) }))}` : ''}</div></div>`)
    .join('<div style="border-top:1px solid var(--self-line);margin:0 14px"></div>');

  const rs = val('rideStats');
  const hours = val('powerOnHours');
  const motorHours = val('motorHours');
  const stats = [];
  if (rs) {
    stats.push([t('ride.dist'), km(rs.distance, 1), rs.resetAt ? t('ride.reset', { date: fmtDate(rs.resetAt) }) : '']);
    if (rs.distance > 0) stats.push([t('ride.off'), `${km(rs.offDistance, 1)} · ${fmtNum((rs.offDistance / rs.distance) * 100)} %`, '']);
    stats.push([t('ride.motorWh'), `${fmtNum(rs.motorWh)} Wh`, rs.distance > 0 ? t('ride.whkm', { v: fmtNum(rs.motorWh / (rs.distance / 1000), 1) }) : '']);
    if (rs.otherWh) stats.push([t('ride.otherWh'), `${fmtNum(rs.otherWh)} Wh`, '']);
  }
  if (hours != null) stats.push([t('ride.hours'), `${fmtNum(hours)} h`, motorHours != null ? t('ride.hoursMotor', { h: fmtNum(motorHours) }) : '']);
  if (ok('cadence')) stats.push([t('ride.cadence'), txt('cadence'), t('ride.cadenceHint')]);

  $('ride').innerHTML = `
    ${modes.length ? `<p class="gh">${esc(t('ride.modesTitle'))}</p><div class="group">${modeRows}</div>
      <p class="foot">${esc(t('ride.modesFoot'))}</p>` : ''}
    ${stats.length ? `<p class="gh">${esc(t('ride.statsTitle'))}</p><div class="group noico">${stats.map(([k, v, hint]) =>
      `<div class="row static"><span class="t">${esc(k)}${hint ? `<small>${esc(hint)}</small>` : ''}</span><span class="kvv" style="color:var(--self-text);font-weight:600">${esc(v)}</span></div>`).join('')}</div>` : ''}`;
}

// Stapel: Fahrmodi → einzelner Modus; „Zurück“ geht eine Ebene hoch
const stack = [];
function openPage(name, arg) {
  if (!rows.length && name !== 'legal') return toast(t('ui.notConnected'), 'warn');
  stack.push({ name, arg });
  drawPage();
  $('sheet').classList.add('open');
}
function drawPage() {
  const { name, arg } = stack[stack.length - 1];
  const page = PAGES[name](arg);
  $('sheetTitle').textContent = page.title;
  $('sheetBack').textContent = stack.length > 1 ? `‹ ${t('ui.back')}` : t('ui.close');
  $('sheetBody').innerHTML = page.html;
  $('sheetBody').scrollTop = 0;
  page.bind?.();
}
function closePage() { stack.length = 0; $('sheet').classList.remove('open'); }
$('sheetBack').onclick = () => { stack.pop(); if (stack.length) drawPage(); else closePage(); };
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closePage(); });

const locked = (cond) => (cond ? `<div class="alert">${esc(t('ui.locked'))}</div>` : '');
const saveBtn = (id = 'save', disabled = false) => `<button class="btn-big" id="${id}"${disabled ? ' disabled' : ''}>${esc(t('ui.save'))}</button>`;

// Plan bauen → bei „nichts zu tun“ Meldung, sonst Bestätigung zeigen
function propose(fn) {
  let plan;
  try { plan = fn(); } catch (e) { return toast(e.message, 'warn'); }
  if (!plan.steps.length) return toast(t('msg.noChange'), 'ok');
  if (blocked) return toast(t('msg.abort', { error: '' }), 'err');
  pending = { plan, state: S };
  $('confirmPlan').textContent = plan.title;
  $('confirmList').innerHTML = plan.steps.map((s) => `<div class="row static"><span class="t">${esc(s.label ?? dpLabel(s.key))}
    <span class="chg"><span class="b">${esc(s.before)}</span><span class="a">${esc(s.after)}</span></span></span></div>`).join('');
  $('confirmWarn').innerHTML = plan.warnings.map((w) => `<div class="alert">${esc(w)}</div>`).join('');
  $('confirmText').textContent = t(demo ? 'ui.confirmDemo' : 'ui.confirmText');
  $('confirmSheet').classList.add('open');
}
$('confirmCancel').onclick = () => { pending = null; $('confirmSheet').classList.remove('open'); toast(t('msg.cancelled')); };

          $('kmRow').classList.toggle('hidden', !$('byKm').checked);
          $('dateRow').classList.toggle('hidden', !$('byDate').checked);
          const add = Number($('kmIn').value);
          $('kmTarget').textContent = ok('odometer') && add > 0 ? t('svc.target', { km: km(val('odometer') + add * 1000) }) : '';
        };
        $('byKm').onchange = upd; $('byDate').onchange = upd; $('kmIn').oninput = upd; upd();
        $('save').onclick = () => {
          let odometer = 0; let timestamp = 0;
          if ($('byKm').checked) {
            const add = Number($('kmIn').value);
            if (!Number.isInteger(add) || add < 1) return toast(t('msg.kmInt'), 'warn');
            if (!ok('odometer')) return toast(t('msg.odoUnreadable'), 'warn');
            odometer = val('odometer') + add * 1000;
          }
          if ($('byDate').checked) {
            const [y, mo, d] = $('dateIn').value.split('-').map(Number);
            if (!y) return toast(t('msg.chooseDate'), 'warn');
            timestamp = Date.UTC(y, mo - 1, d) / 1000;
          }
          if (!odometer && !timestamp) return toast(t('msg.chooseKmOrDate'), 'warn');
          propose(() => planService(S, { timestamp, odometer }));
        };
        $('del').onclick = () => propose(() => planService(S, { timestamp: 0, odometer: 0 }));
      },
    };
  },

  display() {
    const opts = (list, cur) => {
      const all = cur != null && !list.some((o) => String(o.value) === String(cur)) ? [{ value: cur, text: String(cur) }, ...list] : list;
      return all.map((o) => `<option value="${esc(o.value)}"${String(o.value) === String(cur) ? ' selected' : ''}>${esc(o.text)}</option>`).join('');
    };
    const startLocked = val('startModeOem')?.configurable !== true;
    const walkLocked = !ok('walkAssist') || val('walkAssistOem')?.configurable !== true;
    return {
      title: t('disp.title'),
      html: `<p class="explain">${esc(t('ui.dispExplain'))}</p>
        <div class="group noico" style="margin-top:12px">
          <label class="row"><span class="t">${esc(t('disp.start'))}</span><select id="dStart"${startLocked ? ' disabled' : ''}>${opts(startModeOptions(modes.map((m) => m.name)), val('startMode'))}</select></label>
          <label class="row"><span class="t">${esc(t('disp.lang'))}</span><select id="dLang">${opts(DISPLAY_LANGUAGES.map((c) => ({ value: c, text: LANGS[c] })), val('displayLanguage'))}</select></label>
          <label class="row"><span class="t">${esc(t('disp.units'))}</span><select id="dUnits">${opts([{ value: 0, text: t('disp.metric') }, { value: 1, text: t('disp.imperial') }], val('displayUnits'))}</select></label>
          <label class="row"><span class="t">${esc(t('disp.timeFormat'))}</span><select id="dTime">${opts([{ value: 0, text: t('disp.h24') }, { value: 1, text: t('disp.h12') }], val('timeFormat'))}</select></label>
        </div>
        <div class="group noico" style="margin-top:14px">
          <label class="row"><span class="t">${esc(t('disp.walk'))}<small>${esc(t('ui.walkHint'))}</small></span><input type="checkbox" class="sw" id="dWalk"${val('walkAssist')?.enabled ? ' checked' : ''}${walkLocked ? ' disabled' : ''}></label>
          <label class="row"><span class="t">${esc(t('ui.clock'))}<small>${esc(`${t('disp.clock')}: ${txt('bikeClock')}`)}</small></span><input type="checkbox" class="sw" id="dClock"${ok('bikeClock') ? '' : ' disabled'}></label>
        </div>
        ${saveBtn()}`,
      bind() {
        $('save').onclick = () => propose(() => planDisplay(S, {
          startMode: Number($('dStart').value), language: $('dLang').value,
          displayUnits: Number($('dUnits').value), timeFormat: Number($('dTime').value), setClock: $('dClock').checked,
          walkAssist: ok('walkAssist') ? $('dWalk').checked : null,
        }, modes.map((m) => m.name)));
      },
    };
  },

  battery() {
    const [hText, hKind] = health(val('batterySoh'));
    const item = (label, value, cls = '') => `<div class="row static"><span class="t">${esc(label)}</span><span class="kvv ${cls}">${esc(value)}</span></div>`;
    return {
      title: t('more.battery'),
      html: `<div class="group noico">
        ${item(t('bat.soc'), txt('batterySoc'))}
        ${item(t('bat.soh'), hText ? `${txt('batterySoh')} · ${hText}` : txt('batterySoh'), hKind)}
        ${item(t('bat.cycles'), txt('batteryCycles'))}
        ${item(t('bat.remaining'), txt('batteryRiderWh'))}
        ${item(t('bat.energy'), txt('batteryEnergy'))}
        ${item(t('more.capacity'), txt('batteryCapacityAh'))}
        ${item(t('more.voltage'), txt('batteryVoltage'))}
        ${item(t('more.tempNow'), `${txt('batteryTempNow')} · ${txt('batteryFetTemp')}`)}
        ${item(t('bat.model'), txt('batteryProduct'))}
        </div><p class="foot">${esc(t('bat.sohHint'))}</p>`,
    };
  },

  faults() {
    const body = faults.map((f) => {
      let inner;
      if (f.status === 'none') inner = `<div class="fault"><span>${esc(t('fault.notInstalled'))}</span></div>`;
      else if (f.status !== 'ok') inner = `<div class="fault"><span>${esc(t('fault.unreadable'))}</span></div>`;
      else if (!f.faults.length) inner = `<div class="fault"><span class="good">${esc(t('fault.none'))}</span></div>`;
      else inner = f.faults.map((e) => {
        const info = lookupIssue(e.code ?? 0, lang());
        const code = (e.code ?? 0).toString(16).toUpperCase().padStart(6, '0');
        return `<div class="fault"><b>${esc(info?.t || t('fault.code', { code }))}</b>
          <span>${esc(`${t('fault.code', { code })} · ${e.count ?? '?'}× · ${e.timestamp > 0 ? t('fault.last', { date: fmtDateTime(e.timestamp * 1000) }) : t('fault.noTime')}`)}</span>
          ${info?.d ? `<span style="margin-top:4px">${esc(info.d)}</span>` : ''}
          ${info?.m ? `<span style="margin-top:4px"><b style="display:inline">${esc(t('issues.measures'))}:</b> ${esc(info.m)}</span>` : ''}</div>`;
      }).join('');
      return `<p class="gh">${esc(t(`fault.${f.component}`))}</p><div class="group">${inner}</div>`;
    }).join('');
    // Klartexte aus der eigenen Flow-App laden, falls nicht schon auf dem Server
    const info = catalogInfo();
    const catalog = info?.fromServer ? '' : `<p class="gh">${esc(t('issues.title'))}</p><div class="group noico">
      <label class="row"><span class="t">${esc(t('issues.choose'))}<small>${esc(info ? t('issues.loaded', { n: fmtNum(info.count), langs: info.langs.join(', ') }) : t('issues.none'))}</small></span>
        <span class="chev">›</span><input type="file" id="issuesFile" class="hidden"></label></div>
      <p class="foot">${esc(t('issues.text'))}</p>`;
    return {
      title: t('ui.faults'),
      html: `<p class="explain">${esc(t('ui.faultsExplain'))}</p>${body}${catalog}`,
      bind() {
        if (!$('issuesFile')) return;
        $('issuesFile').onchange = async () => {
          const f = $('issuesFile').files[0];
          if (!f) return;
          toast(t('issues.reading'));
          try { await importCatalog(f); toast(t('issues.loaded', { n: fmtNum(catalogInfo().count), langs: catalogInfo().langs.join(', ') }), 'ok'); } catch (err) {
            toast(t(err.message === 'no-catalog' ? 'issues.notFound' : 'issues.error', { error: err.message }), 'warn');
          }
          drawPage();
        };
      },
    };
  },

  all() {
    const groups = {};
    for (const r of rows) (groups[r.group] ??= []).push(r);
    return {
      title: t('ui.allValues'),
      html: Object.entries(groups).map(([g, list]) => `<p class="gh">${esc(g)}</p><div class="group noico">${list.map((r) =>
        `<div class="row static"><span class="t" style="font-size:15px">${esc(dpLabel(r.key))}</span><span class="kvv">${esc(r.status === 'ok' ? (r.text || '–') : '–')}</span></div>`).join('')}</div>`).join(''),
    };
  },
};

// ---------- Ändern: Backup → prüfen → schreiben → zurücklesen ----------

const RING = 2 * Math.PI * 58;
function ring(f, kind = '') {
  const v = Math.max(0, Math.min(1, f));
  $('ringArc').style.strokeDashoffset = `${RING * (1 - v)}`;
  $('ringArc').style.stroke = kind === 'err' ? 'var(--self-red)' : kind === 'warn' ? 'var(--self-yellow)' : 'var(--self-teal-bright)';
  $('ringPct').textContent = `${Math.round(v * 100)}%`;
}
function progStatus(text, kind = '') { $('progStatus').textContent = text; $('progStatus').className = `status ${kind}`; }
function progDone(kind) {
  if (kind === 'ok') ring(1);
  else $('ringArc').style.stroke = kind === 'err' ? 'var(--self-red)' : 'var(--self-yellow)';
  $('progKofi').classList.toggle('hidden', kind !== 'ok');
  $('progDone').classList.remove('hidden');
}
$('progDone').onclick = () => { $('progSheet').classList.remove('open'); closePage(); };

async function saveBackup(change) {
  const handle = demo ? null : await pickBackupFile(backupFileName({ createdAt: new Date().toISOString() }));
  const fresh = await readAll(reader);
  const freshState = byKey(fresh);
  const freshModes = await readAssistModes(reader, freshState.activeModes?.value ?? [], freshState.modeNames?.value ?? []);
  const backup = createBackup(fresh, change, freshModes);
  if (demo) return { backup, fresh, saved: { name: t('demo.backupName'), method: 'demo' } };
  const saved = await writeBackupFile(backup, handle);
  if (saved.method === 'download' && !confirm(t('msg.backupConfirmDownload', { name: saved.name }))) throw new Error(t('msg.backupNotConfirmed'));
  return { backup, fresh, saved };
}

$('confirmGo').onclick = async () => {
  if (!pending || busy || blocked) return;
  const { plan, state: previewState } = pending;
  busy = true;
  renderHead();
  $('confirmSheet').classList.remove('open');
  $('progTitle').textContent = plan.title;
  $('progLog').textContent = '';
  $('progKofi').classList.add('hidden');
  $('progDone').classList.add('hidden');
  progStatus(t('msg.backupReading'));
  ring(0);
  $('progSheet').classList.add('open');
  const total = plan.steps.length || 1;
  let done = 0;
  const plog = (m) => {
    log(m); $('progLog').textContent += `${new Date().toLocaleTimeString()}  ${m}\n`;
    if (/^OK /.test(m)) ring((done = Math.min(total, done + 1)) / total);
  };
  let backup = null;
  try {
    const result = await saveBackup({ title: plan.title, steps: plan.steps.map(({ key, before, after }) => ({ key, before, after })) })
      .catch((e) => { throw Object.assign(e, { beforeWrite: true }); });
    backup = result.backup;
    const now = byKey(result.fresh);
    for (const key of guardedKeys(plan)) {
      if (now[key]?.rawHex !== previewState[key]?.rawHex) throw new Error(t('msg.changedPreview', { label: dpLabel(key) }));
    }
    savePending({
      bikeId: now.motorBikeId?.value, at: new Date().toISOString(), title: plan.title, backupName: result.saved.name,
      steps: plan.steps.map((s) => {
        const known = !s.write && !s.volatile;
        return { key: s.key, label: s.label ?? dpLabel(s.key), before: s.before, after: s.after,
          beforeHex: known ? now[s.key]?.rawHex ?? '' : null, afterHex: known ? hex(s.payload) : null };
      }),
    });
    progStatus(t('msg.changing', { title: plan.title }));
    const applied = await applyPlan(reader, plan, now, plog);
    clearPending();
    recordOutcome(backup.createdAt, { ok: true, at: new Date().toISOString(), done: applied.done });
    pending = null;
    plog(`FERTIG: ${plan.title}`);
    const restart = plan.steps.some((s) => s.key.startsWith('light')) ? ` ${t('msg.restart')}` : '';
    const changed = t('ui.changed') + restart;
    try { await refresh(); } catch (e) {
      await disconnect();
      progStatus(`${changed} ${t('msg.readError', { error: e.message })}`, 'warn');
      return progDone('warn');
    }
    progStatus(changed, 'ok');
    progDone('ok');
  } catch (e) {
    if (e.uncertain) {
      blocked = true;
      plog(`ABBRUCH nach Schreibversuch (${e.attempted.join(', ')}): ${e.message}`);
      progStatus(t('msg.abort', { error: e.message }), 'err');
      progDone('err');
    } else {
      clearPending();
      plog(`Nicht geändert: ${e.message}`);
      progStatus(e.beforeWrite && e.name === 'AbortError' ? t('msg.noLocation') : t('msg.notChanged', { error: e.message }), 'warn');
      progDone('warn');
    }
    if (backup) recordOutcome(backup.createdAt, { ok: false, at: new Date().toISOString(), error: e.message, attempted: e.attempted ?? [] });
  } finally {
    busy = false;
    renderAll();
  }
};

async function manualBackup() {
  if (!reader || busy) return;
  busy = true; renderHead();
  toast(t('msg.backupReading'));
  try {
    const { saved } = await saveBackup({ title: t('title.manualBackup'), steps: [] });
    toast(t('msg.backupSaved', { name: saved.name }), 'ok');
  } catch (e) {
    toast(e.name === 'AbortError' ? t('msg.noLocation') : t('msg.backupFailed', { error: e.message }), 'warn');
  } finally { busy = false; renderHead(); }
}

// ---------- Verbinden und Auslesen ----------

async function refresh() {
  busy = true;
  renderHead();
  rows = await readAll(reader, (row, i) => { $('pageSub').textContent = t('msg.reading', { n: i + 1, total: READ_PLAN.length }); });
  S = byKey(rows);
  $('pageSub').textContent = t('msg.readingFaults');
  faults = await readFaults(reader);
  $('pageSub').textContent = t('msg.readingModes');
  modes = await readAssistModes(reader, val('activeModes') ?? [], val('modeNames') ?? []);
  busy = false;
  if (!demo) addSnapshot(snapshotFromRows(rows, new Date()));
  renderAll();
  if (stack.length) drawPage();
}

async function connectWith(u, isDemo) {
  busy = true;
  demo = isDemo;
  renderHead();
  $('connect').disabled = true;
  $('pageSub').textContent = t('msg.connecting', { name: u.device.productName });
  try {
    usb = u;
    await usb.open();
    reader = new BikeReader(usb);
    await refresh();
    blocked = false;
    startHeartbeat();
    if (demo) toast(t('demo.on'), 'warn');
  } catch (e) {
    log(`Fehler: ${e.message}`);
    await disconnect();
    toast(`${t('msg.connectFailed', { error: e.message })}${/claim/i.test(e.message) ? ' ' + t('msg.busyHint') : ''}`, 'err');
  }
  busy = false;
  $('connect').disabled = !window.isSecureContext;
  renderAll();
}

$('connect').onclick = async () => {
  if (!discAccepted()) return showDisclaimer();
  if (!('usb' in navigator)) return toast(t('msg.noWebusb'), 'err');
  let device;
  try {
    device = await McspUsb.request(); // muss als Erstes im Klick passieren
  } catch (e) {
    return toast(e.name === 'NotFoundError' ? t('msg.noDevice') : `${e.name}: ${e.message}`, 'warn');
  }
  await connectWith(new McspUsb(device, log), false);
};
$('demoStart').onclick = async () => {
  if (!discAccepted()) return showDisclaimer();
  await connectWith(new DemoUsb(log), true);
};

function startHeartbeat() {
  clearInterval(hbTimer);
  hbFailures = 0;
  hbTimer = setInterval(async () => {
    if (busy || !reader || performance.now() - reader.lastActivity < 1100) return;
    try { await heartbeat(reader); hbFailures = 0; } catch (e) {
      log(`Lebenszeichen fehlgeschlagen (${++hbFailures}): ${e.message}`);
      if (hbFailures >= 3 && !busy) { await disconnect(); toast(t('msg.hbLost'), 'warn'); }
    }
  }, 1500);
}

async function disconnect() {
  clearInterval(hbTimer);
  hbTimer = null;
  const u = usb;
  usb = null;
  reader = null;
  pending = null;
  if (u) await u.close();
  busy = false;
  renderAll();
}
navigator.usb?.addEventListener('disconnect', async (e) => {
  if (usb && e.device === usb.device) { await disconnect(); toast(t('msg.cableOff'), 'warn'); }
});

// ---------- Rechtlicher Hinweis ----------

const DISC_KEY = 'selfbike-disclaimer';
function discAccepted() {
  try { const d = JSON.parse(localStorage.getItem(DISC_KEY)); return d?.v === 1 ? d : null; } catch { return null; }
}
function showDisclaimer() {
  const accepted = !!discAccepted();
  $('discAcceptBox').classList.toggle('hidden', accepted);
  $('discClose').classList.toggle('hidden', !accepted);
  $('discCheck').checked = false;
  $('discAccept').disabled = true;
  $('discSheet').classList.add('open');
}
$('discCheck').onchange = () => { $('discAccept').disabled = !$('discCheck').checked; };
$('discAccept').onclick = () => {
  try { localStorage.setItem(DISC_KEY, JSON.stringify({ v: 1, at: new Date().toISOString(), lang: lang() })); } catch { /* egal */ }
  $('discSheet').classList.remove('open');
};
$('discClose').onclick = () => $('discSheet').classList.remove('open');
$('showLegal').onclick = () => showDisclaimer();

// ---------- Sprache ----------

// Oben immer sichtbar (Kürzel), im Hinweis-Fenster mit vollem Namen
$('topLang').innerHTML = Object.entries(LANGS).map(([c, n]) => `<option value="${c}" title="${esc(n)}">${esc(c.toUpperCase())}</option>`).join('');
$('discLang').innerHTML = Object.entries(LANGS).map(([c, n]) => `<option value="${c}">${esc(n)}</option>`).join('');
$('topLang').onchange = () => changeLang($('topLang').value);
$('discLang').onchange = () => changeLang($('discLang').value);
async function changeLang(code) {
  await setLang(code);
  $('discLang').value = $('topLang').value = lang();
  // gelesene Werte neu übersetzen geht über ein erneutes Auslesen; die Oberfläche sofort
  applyStatic();
  renderAll();
  if (stack.length) drawPage();
}

// ---------- Start ----------

await loadCatalog();
await setLang(detectLang());
$('discLang').value = $('topLang').value = lang();
applyStatic();
if (!window.isSecureContext) {
  $('connect').disabled = true;
  $('insecure').textContent = t('msg.insecure', { link: `https://${location.hostname}:8094${location.pathname}` });
  $('insecure').classList.remove('hidden');
}
renderAll();
if (!discAccepted()) showDisclaimer();
</script>
