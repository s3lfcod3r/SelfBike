<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SelfBike</title>
<link rel="icon" type="image/png" sizes="64x64" href="brand/favicon-64.png">
<link rel="apple-touch-icon" href="brand/favicon-192.png">
<link rel="stylesheet" href="brand/tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--self-bg-0);color:var(--self-text);
  font-family:var(--self-font-sans);-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
/* 4k + VRR (variable Bildwiederholrate): große, flache Dunkelflächen flackern, weil der flache
   Seitenhintergrund bei variabler Bildrate ungleichmäßig dargestellt wird. Ein eigener, dauerhaft
   GPU-kompositierter Layer (fixed + translateZ(0)) hält das Bild stabil. Bewusst NICHT auf <body>
   selbst – sonst würden die position:fixed-Dialoge (.modal) ihren Viewport-Bezug verlieren. */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--self-bg-0);transform:translateZ(0)}

.app{width:100%;max-width:470px;background:var(--self-bg-1);
  border:1px solid var(--self-line);border-radius:22px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55)}

/* Kopf */
.top{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--self-line)}
.top img{width:30px;height:30px;border-radius:9px;flex:none}
.wm{font-family:var(--self-font-wordmark);font-weight:800;font-size:18px;letter-spacing:.01em;line-height:1}
.wm .a{color:var(--self-ice)}.wm .b{color:var(--self-teal)}
.sp{flex:1}
.langsel{background:var(--self-bg-2);color:var(--self-text);border:1px solid var(--self-line-strong);
  border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.langsel option{background:var(--self-bg-2);color:var(--self-text)}

/* Intro */
.intro{padding:18px 18px 8px}
.intro h1{font-size:21px;margin:0 0 5px;letter-spacing:-.01em}
.intro p{color:var(--self-text-2);font-size:13.5px;line-height:1.5;margin:0}

/* Auswahl – symmetrisch */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 6px;align-items:stretch}
.card{background:var(--self-bg-2);border:1px solid var(--self-line);border-radius:var(--self-radius);
  padding:15px 14px;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:11px;min-height:52px;margin-bottom:12px}
.tt h3{min-height:2.3em}
.ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--self-bg-3);
  display:grid;place-items:center;font-size:22px;border:1px solid var(--self-line)}
.tt h3{margin:0;font-size:15px;line-height:1.15;letter-spacing:-.01em}
.tt .k{font-family:var(--self-font-mono);font-size:10.5px;color:var(--self-teal);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

.feat{list-style:none;padding:0;margin:0 0 14px;flex:1;display:flex;flex-direction:column;gap:9px}
.feat li{font-size:12px;color:var(--self-text-2);line-height:1.35;display:grid;grid-template-columns:16px 1fr;gap:7px;align-items:start;min-height:17px}
.feat li::before{content:"✓";color:var(--self-teal);font-weight:800;font-size:12px;line-height:1.35}

.acts{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:var(--self-radius);
  padding:11px;font-size:14px;font-weight:700;font-family:var(--self-font-sans);cursor:pointer;text-decoration:none;
  transition:filter var(--self-dur-fast),border-color var(--self-dur-fast),color var(--self-dur-fast)}
.btn-primary{background:linear-gradient(120deg,var(--self-teal),var(--self-teal-deep));color:#041310}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--self-text-2);border:1px solid var(--self-line-strong)}
.btn-ghost:hover{border-color:var(--self-teal);color:var(--self-text)}

/* Fuß */
.foot{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  padding:16px 18px 20px;margin-top:8px;border-top:1px solid var(--self-line)}
.foot .ver{font-family:var(--self-font-mono);font-size:11px;color:var(--self-text-3)}
.foot a{font-size:12px;color:var(--self-text-2);text-decoration:none;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.foot a.kofi{color:var(--self-teal)}
.foot a:hover{color:var(--self-text)}

/* Rechtshinweis-Fenster */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.box{width:100%;max-width:450px;max-height:88vh;display:flex;flex-direction:column;
  background:var(--self-bg-1);border:1px solid var(--self-line-strong);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--self-line)}
.mhead b{font-size:15px}
.mhead button{background:none;border:0;color:var(--self-text-2);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.mbody{overflow-y:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
.mbody h3{font-size:17px;margin:0 0 6px;letter-spacing:-.01em}
.mbody h4{font-size:13.5px;margin:15px 0 2px;color:var(--self-text)}
.mbody p{font-size:13px;color:var(--self-text-2);line-height:1.5;margin:0 0 4px}
.mbody a{color:var(--self-teal);text-decoration:none}
.lbl{display:flex;align-items:center;gap:11px;margin:18px 0 12px;font-size:13.5px;color:var(--self-text)}
.lbl input{width:20px;height:20px;flex:none;accent-color:var(--self-teal)}
.maccept{display:block;width:100%;padding:12px;border:0;border-radius:var(--self-radius);font-weight:700;font-size:14px;cursor:pointer;
  font-family:var(--self-font-sans);background:linear-gradient(120deg,var(--self-teal),var(--self-teal-deep));color:#041310}
.maccept:disabled{opacity:.45;cursor:default}

@media(max-width:400px){.grid{grid-template-columns:1fr}.ch{min-height:0}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <img src="brand/favicon-64.png" alt="">
    <span class="wm"><span class="a">Self</span><span class="b">Bike</span></span>
    <span class="sp"></span>
    <select id="lang" class="langsel" aria-label="Sprache / Language"></select>
  </div>

  <div class="intro">
    <h1 id="t-title"></h1>
    <p id="t-intro"></p>
  </div>

  <div class="grid">
    <!-- BES2 -->
    <div class="card">
      <div class="ch">
        <div class="ic">🔧</div>
        <div class="tt"><h3>Kiox · Nyon · Intuvia</h3><div class="k" id="t-bes2k"></div></div>
      </div>
      <ul class="feat">
        <li id="t-bes2f1"></li><li id="t-bes2f2"></li><li id="t-bes2f3"></li><li id="t-bes2f4"></li>
      </ul>
      <div class="acts">
        <a class="btn btn-primary go" href="gen2-gen4.html" id="t-open1"></a>
        <a class="btn btn-ghost go" href="gen2-gen4.html?demo=1" id="t-demo1"></a>
      </div>
    </div>

    <!-- Smart System -->
    <div class="card">
      <div class="ch">
        <div class="ic">⚡</div>
        <div class="tt"><h3>Smart System</h3><div class="k" id="t-ssk"></div></div>
      </div>
      <ul class="feat">
        <li id="t-ssf1"></li><li id="t-ssf2"></li><li id="t-ssf3"></li><li id="t-ssf4"></li>
      </ul>
      <div class="acts">
        <a class="btn btn-primary go" href="smart.html" id="t-open2"></a>
        <a class="btn btn-ghost go" href="smart.html?demo=1" id="t-demo2"></a>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="ver" id="verLabel">SelfBike</span>
    <a class="kofi" href="https://ko-fi.com/s3lfcod3r" target="_blank" rel="noopener">☕ <span id="t-support"></span></a>
    <a href="#" id="legalLink"><span data-i18n="tools.legal"></span></a>
  </div>
  <div class="footnote" style="max-width:720px;margin:12px auto 0;text-align:center;font-size:12px;line-height:1.5;color:var(--self-text-2,#8a9caa)">
    <p style="margin:0 0 6px"><span data-i18n="free.support"></span> <a href="mailto:info@selfcoder.de" style="color:var(--self-teal-bright,#43d3ad)">info@selfcoder.de</a></p>
    <p style="margin:0"><span data-i18n="free.kofi"></span></p>
  </div>
</div>

<!-- Rechtshinweis -->
<div class="modal" id="legal" role="dialog" aria-modal="true">
  <div class="box">
    <div class="mhead"><b data-i18n="tools.legal"></b><button id="legalX" aria-label="X">✕</button></div>
    <div class="mbody">
      <h3 data-i18n="disc.title"></h3>
      <p data-i18n="disc.intro"></p>
      <h4 data-i18n="disc.1t"></h4><p data-i18n="disc.1"></p>
      <h4 data-i18n="disc.2t"></h4><p data-i18n="disc.2"></p>
      <h4 data-i18n="disc.3t"></h4><p data-i18n="disc.3"></p>
      <h4 data-i18n="disc.4t"></h4><p data-i18n="disc.4"></p>
      <h4 data-i18n="disc.5t"></h4><p data-i18n="disc.5"></p>
      <h4 data-i18n="disc.6t"></h4><p data-i18n="disc.6"></p>
      <h4 data-i18n="disc.7t"></h4><p data-i18n="disc.7"></p>
      <h4 data-i18n="disc.8t"></h4><p data-i18n="disc.8"></p>
      <p><span data-i18n="disc.contact"></span>: <a href="mailto:info@selfcoder.de">info@selfcoder.de</a> ·
        <a href="https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener" data-i18n="disc.ghPrivacy"></a></p>
      <p style="margin-top:12px;font-size:12px" data-i18n="disc.binding"></p>
      <div id="legalAcceptBox">
        <label class="lbl"><input type="checkbox" id="legalCheck"><span data-i18n="disc.check"></span></label>
        <button class="maccept" id="legalAccept" disabled data-i18n="disc.accept"></button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="chooser.js"></script>
</body>
</html>
