<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SelfBike – Getestete Hardware</title>
<link rel="icon" type="image/png" sizes="64x64" href="brand/favicon-64.png">
<link rel="apple-touch-icon" href="brand/favicon-192.png">
<link rel="stylesheet" href="brand/tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--self-bg-0);color:var(--self-text);font-family:var(--self-font-sans);
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--self-bg-0);transform:translateZ(0)}
.wrap{width:100%;max-width:560px}
.app{background:var(--self-bg-1);border:1px solid var(--self-line);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}

/* Kopf */
.top{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--self-line)}
.top img{width:30px;height:30px;border-radius:9px;flex:none}
.wm{font-family:var(--self-font-wordmark);font-weight:800;font-size:18px;letter-spacing:.01em;line-height:1}
.wm .a{color:var(--self-ice)}.wm .b{color:var(--self-teal)}
.sp{flex:1}
.langsel{background:var(--self-bg-2);color:var(--self-text);border:1px solid var(--self-line-strong);
  border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
.langsel option{background:var(--self-bg-2);color:var(--self-text)}

/* Hero */
.hero{padding:22px 20px 6px}
.hero h1{font-size:23px;margin:0 0 7px;letter-spacing:-.02em;line-height:1.1}
.grad{background:linear-gradient(120deg,var(--self-ice-bright),var(--self-teal-bright));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--self-text-2);font-size:14px;line-height:1.55;margin:0}

/* Statleiste */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px 20px 4px}
.stat{background:var(--self-bg-2);border:1px solid var(--self-line);border-radius:12px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;color:var(--self-teal-bright);line-height:1}
.stat span{display:block;font-size:10.5px;color:var(--self-text-3);margin-top:5px;line-height:1.2;text-transform:uppercase;letter-spacing:.04em}

/* System-Blöcke */
.sys{margin:16px 20px 0;background:var(--self-bg-2);border:1px solid var(--self-line);border-radius:16px;overflow:hidden}
.sys-h{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid var(--self-line);position:relative}
.sys-h::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.sys-ic{width:42px;height:42px;flex:none;border-radius:12px;background:var(--self-bg-3);display:grid;place-items:center;font-size:21px;border:1px solid var(--self-line)}
.sys-h h2{margin:0;font-size:16px;letter-spacing:-.01em}
.sys-h .k{font-family:var(--self-font-mono);font-size:10.5px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.sys-b{padding:6px 16px 15px}
.cat{padding:12px 0;border-bottom:1px solid var(--self-line)}
.cat:last-child{border-bottom:0}
.cat .ct{font-size:12px;font-weight:700;color:var(--self-text);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--self-bg-3);border:1px solid var(--self-line-strong);
  border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--self-text);font-family:var(--self-font-mono)}
.chip::before{content:"✓";color:var(--acc);font-weight:800;font-size:11px}
.chip.plain{font-family:var(--self-font-sans)}
.reads{font-size:12.5px;color:var(--self-text-2);line-height:1.5;margin:10px 0 0}
.foot-note{font-size:11.5px;color:var(--self-text-3);line-height:1.5;margin:8px 0 0}

/* Räder */
.bikes{margin:16px 20px 0}
.bikes .ct{font-size:12px;font-weight:700;color:var(--self-text);margin:0 0 9px;text-transform:uppercase;letter-spacing:.04em}

/* CTA */
.cta{margin:18px 20px 4px;background:linear-gradient(135deg,rgba(51,167,140,.14),rgba(67,211,173,.08));
  border:1px solid var(--self-line-strong);border-radius:16px;padding:16px}
.cta p{margin:0;font-size:13.5px;line-height:1.55;color:var(--self-text)}
.cta a{color:var(--self-teal-bright);text-decoration:none;font-weight:700}

/* Fuß */
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 20px 22px;margin-top:14px;border-top:1px solid var(--self-line)}
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--self-text);text-decoration:none;
  background:var(--self-bg-2);border:1px solid var(--self-line-strong);border-radius:999px;padding:9px 15px}
.back:hover{border-color:var(--self-teal);color:var(--self-teal-bright)}
.asof{font-family:var(--self-font-mono);font-size:11px;color:var(--self-text-3)}

@media(max-width:430px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="app">
  <div class="top">
    <img src="brand/favicon-64.png" alt="">
    <span class="wm"><span class="a">Self</span><span class="b">Bike</span></span>
    <span class="sp"></span>
    <select id="lang" class="langsel" aria-label="Sprache / Language"></select>
  </div>

  <div class="hero">
    <h1><span class="grad" id="h-title"></span></h1>
    <p id="h-sub"></p>
  </div>

  <div class="stats">
    <div class="stat"><b>2</b><span id="s-sys"></span></div>
    <div class="stat"><b id="s-mot-n">7</b><span id="s-mot"></span></div>
    <div class="stat"><b>8</b><span id="s-comp"></span></div>
    <div class="stat"><b>✓</b><span id="s-fault"></span></div>
  </div>

  <div id="systems"></div>

  <div class="bikes">
    <p class="ct" id="b-title"></p>
    <div class="chips" id="b-chips"></div>
  </div>

  <div class="cta"><p id="cta-text"></p></div>

  <div class="foot">
    <a class="back" href="index.html">← <span id="f-back"></span></a>
    <span class="asof" id="f-asof"></span>
  </div>
</div>
</div>

  fi:{ title:'Mitä SelfBike jo lukee', sub:'Tämä lista näyttää laitteiston, jonka SelfBike on jo lukenut onnistuneesti – yhteisön oikeiden pöytäkirjojen perusteella. Se kasvaa jokaisella lähetetyllä pöytäkirjalla.', sSys:'Järjestelmät', sMot:'Moottorit', sComp:'Smart-osat', sFault:'Vikamuisti', bTitle:'Pyörät, jotka ovat jo listalla', readsLabel:'Mitä luetaan', cta:'Puuttuuko omasi? Lue pyöräsi ja napauta sitten ”Osallistu listaan” – tai lähetä pöytäkirja osoitteeseen {a}. Mitä enemmän pyöriä, sitä täydellisempi lista – kiitos!', back:'Etusivulle', asof:'Tilanne 20.11.2026', catMotors:'Moottorit', catBatteries:'Akut', catDisplays:'Näytöt ja ohjaimet', catUnits:'Kysellyt ohjainlaitteet', bes2Note:'* COBI (kolmannen osapuolen näyttö): moottori ja akku luettavissa, ei itse näyttö.', bes2Reads:'Kaikki moottorin, akun ja näytön arvot, vikamuisti, huoltohistoria, ajotilastot, vaihteiston/eShiftin tiedot (esim. Rohloff) – sekä turvalliset asetukset (beta). Ei virittelyä.', smartNote:'Vahvistettu oikeilla pyörillä, mm. Cannondale (BDU3741 Cargo Line, akku PowerPack 800, HeadUnit BHU3600, LED Remote BRC3600, eShift). Osat, joita ei ole asennettu (esim. ConnectModule, ABS, 2. akku), ohitetaan.', smartReads:'Kutakin ohjainlaitetta kohden tuotekoodi + ohjelmisto/laitteisto; molempien akkujen arvot; vikamuisti laitekohtaisesti (luku; tyhjennys sallittaessa); varmuuskopio, historia, PDF-raportti.', uMotor:'Moottori', uBattery:'Akku', uBattery2:'2. akku', uDisplay:'Näyttö / HeadUnit', uRemote:'LED Remote', uConnect:'Connect-moduuli', uAbs:'ABS', uGearing:'Vaihteisto / eShift' }
};

var SYS = [
  { sys:'bes2', icon:'🔧', acc:'var(--self-teal)', name:'BES2 (Gen 2–4)', k:'Kiox · Nyon · Intuvia · Purion',
    cats:[
      { tKey:'catMotors', kind:'motors', chips:['BDU250PCX','BDU350','BDU365','BDU450CX','CX Gen 2'] },
      { tKey:'catBatteries', kind:'batteries', chips:['BBP281','BBP290','BBP291','BBS275','PowerPack 400'] },
      { tKey:'catDisplays', kind:'displays', chips:['Intuvia (BUI255)','Kiox (BUI330)','Kiox (BUI350)','Purion (BUI215)','Nyon','COBI *'] }
    ],
    noteKey:'bes2Note', readsKey:'bes2Reads'
  },
  { sys:'smart', icon:'⚡', acc:'var(--self-teal-bright)', name:'Smart System (BES3)', k:'Kiox 300/500 · LED Remote',
    cats:[
      { tKey:'catMotors', kind:'motors', chips:['BDU3740','BDU3741'] },
      { tKey:'catBatteries', kind:'batteries', chips:['BBP3580 (PowerPack 800)','BBP3760'] },
      { tKey:'catDisplays', kind:'displays', chips:[] },
      { tKey:'catUnits', plain:true, uchips:['uMotor','uBattery','uBattery2','uDisplay','uRemote','uConnect','uAbs','uGearing'] }
    ],
    noteKey:'smartNote', readsKey:'smartReads'
  }
];

// Freigegebene Community-Beiträge (nur Modell-Codes) werden hier eingemischt.
var LIST_WORKER = 'https://bike-list.s3lfcod3r.workers.dev';
var COMM = { bes2:{motors:[],batteries:[],displays:[]}, smart:{motors:[],batteries:[],displays:[]}, bikes:[] };
function normKey(s){ return String(s).split('(')[0].replace(/\s+/g,' ').trim().toLowerCase(); }
// Vereinigung ohne Dubletten (nach Code-Teil vor der Klammer), erste Schreibweise gewinnt.
function union(base, extra){
  var out = base.slice(), seen = {};
  out.forEach(function(x){ seen[normKey(x)] = 1; });
  (extra||[]).forEach(function(x){ var k = normKey(x); if (k && !seen[k]) { seen[k] = 1; out.push(x); } });
  return out;
}
var BIKES = ['Cube Reaction Hybrid Pro','Cube Nutrail Hybrid','Radon ZR Team','Radon Relate 8.0','Winora Sinus R5','HNF UD4 (Rohloff)','Nicolai G16 EBOXX','Victoria eTrekking 7.8','Focus Thron² 6.7','Riese & Müller Delite','Cannondale (Smart Cargo)'];

var cur = detectLang(); if (!TR[cur]) cur = 'en';
function T(k){ return (TR[cur] && TR[cur][k]) || TR.en[k] || TR.de[k] || k; }
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function chip(txt, plain){ return '<span class="chip'+(plain?' plain':'')+'">'+esc(txt)+'</span>'; }
function el(id){ return document.getElementById(id); }

function render(){
  document.documentElement.lang = cur;
  el('h-title').textContent = T('title');
  el('h-sub').textContent = T('sub');
  el('s-sys').textContent = T('sSys');
  el('s-mot').textContent = T('sMot');
  el('s-comp').textContent = T('sComp');
  el('s-fault').textContent = T('sFault');
  el('b-title').textContent = T('bTitle');
  el('b-chips').innerHTML = union(BIKES, COMM.bikes).map(function(b){ return chip(b, true); }).join('');
  el('cta-text').innerHTML = esc(T('cta')).replace('{a}', '<a href="mailto:info@selfcoder.de">info@selfcoder.de</a>');
  el('f-back').textContent = T('back');
  el('f-asof').textContent = T('asof');

  var motorSet = {};
  el('systems').innerHTML = SYS.map(function(sy){
    var cats = sy.cats.map(function(c){
      if (c.uchips) {
        var uh = c.uchips.map(function(key){ return chip(T(key), true); }).join('');
        return '<div class="cat"><p class="ct">'+esc(T(c.tKey))+'</p><div class="chips">'+uh+'</div></div>';
      }
      var merged = c.kind ? union(c.chips, (COMM[sy.sys]||{})[c.kind]) : c.chips;
      if (!merged.length) return '';
      if (c.kind === 'motors') merged.forEach(function(m){ motorSet[normKey(m)] = 1; });
      var chipHtml = merged.map(function(ch){ return chip(ch, !!c.plain); }).join('');
      return '<div class="cat"><p class="ct">'+esc(T(c.tKey))+'</p><div class="chips">'+chipHtml+'</div></div>';
    }).join('');
    var reads = '<p class="reads"><b>'+esc(T('readsLabel'))+':</b> '+esc(T(sy.readsKey))+'</p>';
    var note = sy.noteKey ? '<p class="foot-note">'+esc(T(sy.noteKey))+'</p>' : '';
    return '<div class="sys" style="--acc:'+sy.acc+'">'
      + '<div class="sys-h"><div class="sys-ic">'+sy.icon+'</div><div><h2>'+esc(sy.name)+'</h2><div class="k">'+esc(sy.k)+'</div></div></div>'
      + '<div class="sys-b">'+cats+reads+note+'</div></div>';
  }).join('');

  var mn = el('s-mot-n'); if (mn) mn.textContent = Object.keys(motorSet).length || '7';
}

// Freigegebene Beiträge vom Worker holen und einmischen; ohne Worker bleibt die statische Liste.
async function loadCommunity(){
  try {
    var ctrl = new AbortController(); var tm = setTimeout(function(){ ctrl.abort(); }, 8000);
    var r = await fetch(LIST_WORKER + '/list', { signal: ctrl.signal }); clearTimeout(tm);
    if (!r.ok) return;
    var j = await r.json(); var entries = (j && j.entries) || [];
    entries.forEach(function(e){
      var sys = e.sys === 'smart' ? 'smart' : 'bes2'; var tgt = COMM[sys];
      if (e.motor) tgt.motors.push(e.motor);
      if (e.battery) tgt.batteries.push(e.battery);
      if (e.battery2) tgt.batteries.push(e.battery2);
      if (e.display) tgt.displays.push(e.display);
      if (sys === 'smart' && e.remote) tgt.displays.push(e.remote);
      var bike = [e.brand, e.model].filter(Boolean).join(' ').trim();
      if (bike) COMM.bikes.push(bike);
    });
    render();
  } catch (e) { /* ohne Worker: statische Liste */ }
}

(function initLang(){
  var sel = el('lang');
  sel.innerHTML = Object.entries(LANGS).map(function(e){ return '<option value="'+e[0]+'">'+esc(e[1])+'</option>'; }).join('');
  sel.value = cur;
  sel.addEventListener('change', function(){
    cur = sel.value; if (!TR[cur]) cur = 'en';
    try { localStorage.setItem('selfbike-lang', cur); } catch (e) {}
    render();
  });
})();
render();
loadCommunity();
</script>
